name: VETRA Phase 0.5 Gate

on:
  push:
    branches: [ main, master ]

jobs:
  audit-and-test:
    name: Auditoria de Segurança e Banco (Gate 0)
    runs-on: ubuntu-latest
    
    # Cria um PostgreSQL real temporário
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vlos_migrator
          POSTGRES_PASSWORD: vetra_password
          POSTGRES_DB: vetra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Define a pasta correta onde o código do projeto realmente está
    defaults:
      run:
        working-directory: ./vetra-fase0.5/vehicle-life-os

    steps:
      - name: 📥 Baixar o código
        uses: actions/checkout@v4

      - name: ⚙️ Configurar ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Instalar dependências (npm install)
        run: npm install

      - name: 🔍 Verificação de Tipos (Typecheck)
        run: npm run typecheck

      - name: 🏗️ Executar Migrations (Construir banco)
        run: npm run db:migrate
        env:        
          DATABASE_URL: postgres://vlos_migrator:vetra_password@localhost:5432/vetra_test
     
      - name: 🌱 Popular Banco (Seed)
        run: npm run db:seed
        env:        
          DATABASE_URL: postgres://vlos_migrator:vetra_password@localhost:5432/vetra_test
     
      - name: 🛡️ Testes de Segurança, RLS e Auditoria
        run: npx vitest run --run --pool=forks --poolOptions.forks.singleFork=true
        env:
          DATABASE_URL: postgres://vlos_migrator:vetra_password@localhost:5432/vetra_test
          TEST_DATABASE_URL_APP: postgres://vlos_app:vetra_password@localhost:5432/vetra_test
          TEST_DATABASE_URL_MIGRATOR: postgres://vlos_migrator:vetra_password@localhost:5432/vetra_test
          DB_PASSWORD: vetra_password
         
