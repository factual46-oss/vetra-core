name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    name: Qualidade e Testes Unitários
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./vetra-fase0.5/vehicle-life-os
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes Unitários
        run: npm run test:unit

  database:
    name: Testes de Banco, Segurança e Autenticação
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./vetra-fase0.5/vehicle-life-os
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: vetra_password
          POSTGRES_DB: vetra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Aguardar serviços
        run: |
          until pg_isready -h 127.0.0.1 -p 5432 -U postgres; do
            echo "Aguardando PostgreSQL..."
            sleep 1
          done

      - name: Criar roles no banco
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: vetra_password
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: vetra_password
          POSTGRES_DB: vetra_test
          MIGRATOR_DB_PASSWORD: vetra_password
          APP_DB_PASSWORD: vetra_password
          AUTH_DB_PASSWORD: vetra_password
          DATABASE_URL: postgres://postgres:vetra_password@127.0.0.1:5432/vetra_test
        run: |
          chmod +x db/init/01-roles.sh
          ./db/init/01-roles.sh


      - name: Executar Migrations
        env:
          DATABASE_URL: postgres://vlos_migrator:vetra_password@127.0.0.1:5432/vetra_test
        run: npm run db:migrate

      - name: Executar Seed
        env:
          DATABASE_URL: postgres://vlos_migrator:vetra_password@127.0.0.1:5432/vetra_test
        run: npm run db:seed

      - name: Testes de Integração e Segurança
        env:
          NODE_ENV: test
          API_PORT: 3000
          LOG_LEVEL: fatal
          DATABASE_URL: postgres://vlos_app:vetra_password@127.0.0.1:5432/vetra_test
          DATABASE_AUTH_URL: postgres://vlos_auth:vetra_password@127.0.0.1:5432/vetra_test
          DATABASE_MIGRATOR_URL: postgres://vlos_migrator:vetra_password@127.0.0.1:5432/vetra_test
          TEST_DATABASE_URL_MIGRATOR: postgres://vlos_migrator:vetra_password@127.0.0.1:5432/vetra_test
          TEST_DATABASE_URL_APP: postgres://vlos_app:vetra_password@127.0.0.1:5432/vetra_test
          TEST_DATABASE_URL_AUTH: postgres://vlos_auth:vetra_password@127.0.0.1:5432/vetra_test
          REDIS_URL: redis://127.0.0.1:6379
          KEK_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          AUTH_PEPPER: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
          COOKIE_SECRET: vetra_cookie_secret_dev_key_32bytes
          CORS_ORIGINS: http://localhost:3000
          TRUSTED_PROXIES: 127.0.0.1
        run: npm run test:db
