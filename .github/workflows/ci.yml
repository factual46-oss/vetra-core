name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    name: Qualidade e Testes Unitários
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes Unitários
        run: npm run test:unit

  database:
    name: Testes de Banco, Segurança e Autenticação
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vlos_migrator
          POSTGRES_PASSWORD: vetra_password
          POSTGRES_DB: vetra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Aguardar serviços
        run: |
          until pg_isready -h localhost -p 5432 -U vlos_migrator; do
            echo "Aguardando PostgreSQL..."
            sleep 1
          done
          until redis-cli -h localhost -p 6379 ping; do
            echo "Aguardando Redis..."
            sleep 1
          done

      - name: Criar roles no banco
        run: |
          chmod +x db/init/01-roles.sh
          DATABASE_URL="postgres://vlos_migrator:vetra_password@localhost:5432/vetra_test" ./db/init/01-roles.sh

      - name: Executar Migrations
        env:
          DATABASE_URL: postgres://vlos_migrator:vetra_password@localhost:5432/vetra_test
        run: npm run db:migrate

      - name: Executar Seed
        env:
          DATABASE_URL: postgres://vlos_migrator:vetra_password@localhost:5432/vetra_test
        run: npm run db:seed

      - name: Testes de Integração e Segurança
        env:
          TEST_DATABASE_URL_MIGRATOR: postgres://vlos_migrator:vetra_password@localhost:5432/vetra_test
          TEST_DATABASE_URL_APP: postgres://vlos_app:vetra_password@localhost:5432/vetra_test
          TEST_DATABASE_URL_AUTH: postgres://vlos_auth:vetra_password@localhost:5432/vetra_test
          REDIS_URL: redis://localhost:6379
        run: npm run test:db
