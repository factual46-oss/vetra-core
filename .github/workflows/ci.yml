name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    name: Qualidade e Testes Unitários
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./vetra-fase0.5/vehicle-life-os
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes Unitários
        run: npm run test:unit

  database:
    name: Testes de Banco, Segurança e Autenticação
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./vetra-fase0.5/vehicle-life-os
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: vetra_password
          POSTGRES_DB: vetra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Aguardar serviços
        run: |
          until pg_isready -h 127.0.0.1 -p 5432 -U postgres; do
            echo "Aguardando PostgreSQL..."
            sleep 1
          done

      - name: Criar roles no banco
        run: |
          PGPASSWORD=vetra_password psql -h 127.0.0.1 -U postgres -d vetra_test << 'EOF'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'vlos_migrator') THEN
              CREATE ROLE vlos_migrator WITH LOGIN PASSWORD 'vetra_password' CREATEDB;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'vlos_app') THEN
              CREATE ROLE vlos_app WITH LOGIN PASSWORD 'vetra_password' NOSUPERUSER NOBYPASSRLS NOCREATEDB;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'vlos_auth') THEN
              CREATE ROLE vlos_auth WITH LOGIN PASSWORD 'vetra_password' NOSUPERUSER NOBYPASSRLS NOCREATEDB;
            END IF;
          END
          $$;
          GRANT ALL PRIVILEGES ON DATABASE vetra_test TO vlos_migrator;
          ALTER DATABASE vetra_test OWNER TO vlos_migrator;
          EOF

      - name: Executar Migrations
        env:
          DATABASE_URL: postgres://vlos_migrator:vetra_password@127.0.0.1:5432/vetra_test
        run: npm run db:migrate

      - name: Executar Seed
        env:
          DATABASE_URL: postgres://vlos_migrator:vetra_password@127.0.0.1:5432/vetra_test
        run: npm run db:seed

      - name: Testes de Integração e Segurança
        env:
          NODE_ENV: test
          API_PORT: 3000
          LOG_LEVEL: fatal
          DATABASE_URL: postgres://vlos_app:vetra_password@127.0.0.1:5432/vetra_test
          DATABASE_AUTH_URL: postgres://vlos_auth:vetra_password@127.0.0.1:5432/vetra_test
          DATABASE_MIGRATOR_URL: postgres://vlos_migrator:vetra_password@127.0.0.1:5432/vetra_test
          TEST_DATABASE_URL_MIGRATOR: postgres://vlos_migrator:vetra_password@127.0.0.1:5432/vetra_test
          TEST_DATABASE_URL_APP: postgres://vlos_app:vetra_password@127.0.0.1:5432/vetra_test
          TEST_DATABASE_URL_AUTH: postgres://vlos_auth:vetra_password@127.0.0.1:5432/vetra_test
          REDIS_URL: redis://127.0.0.1:6379
          KEK_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          AUTH_PEPPER: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
          COOKIE_SECRET: vetra_cookie_secret_dev_key_32bytes
          CORS_ORIGINS: http://localhost:3000
          TRUSTED_PROXIES: 127.0.0.1
          JWT_KEYS_JSON: >-
            [{"kid":"vetra-key-2026-01","alg":"EdDSA","status":"active","createdAt":"2026-01-01T00:00:00.000Z","publicPem":"-----BEGIN PUBLIC KEY-----\nMCowBQYDK2VwAyEAPm1zV1Z6e9U07FvK4a0h8R+x8UjRkZ+m3l7m/QZ+M0Q=\n-----END PUBLIC KEY-----","privatePem":"-----BEGIN PRIVATE KEY-----\nMC4CAQAwBQYDK2VwBCIEIP4N1rZzZqI7QpX6qM3q5w4j7GZ6+9t6d5F0j8X4uWq7\n-----END PRIVATE KEY-----"}]
        run: npm run test:db
